services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      API_ADDR: :8080
      DATABASE_URL: sqlite:///var/lib/sqlite/coderelay.db
      JUDGE_CPU_LIMIT: "1"
      JUDGE_MEMORY_LIMIT_MB: "512"
      JUDGE_TIME_LIMIT_MS: "2000"
      RUNNER_USE_DOCKER: "false"
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/var/lib/sqlite
      - ./backend/sqlite/migrations:/srv/api/sqlite/migrations:ro
      - ./backend:/workspace/backend:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
    depends_on:
      sqlite:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/workspace/frontend:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  runner-image:
    build:
      context: ./backend/runner
      dockerfile: Dockerfile
    image: coderelay-runner
    command: ["true"]

  sqlite:
    image: keinos/sqlite3:latest
    user: "0"
    command:
      - sh
      - "-c"
      - |
        mkdir -p /var/lib/sqlite
        touch /var/lib/sqlite/coderelay.db
        exec tail -f /dev/null
    environment:
      SQLITE_DB_PATH: /var/lib/sqlite/coderelay.db
    volumes:
      - sqlite-data:/var/lib/sqlite
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/sqlite/coderelay.db"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  sqlite-data:
    driver: local
